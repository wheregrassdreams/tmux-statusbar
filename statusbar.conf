# This plugin owns the status line and tmux's interactive command/message row.
set-option -g status on
set-option -g status-justify absolute-centre
set-option -g status-left-length 40
set-option -g status-right-length 40
set-option -g @_tmux-statusbar-prefix-active '#{||:#{client_prefix},#{==:#{client_key_table},prefix}}'
set-option -g @_tmux-statusbar-badge-active '#{||:#{==:#{client_key_table},sessions},#{&&:#{==:#{@tmux-statusbar-prefix-badge},on},#{E:@_tmux-statusbar-prefix-active}}}'
set-option -g @_tmux-statusbar-window-index-active '#{&&:#{==:#{@tmux-statusbar-window-index-on-prefix},on},#{E:@_tmux-statusbar-prefix-active}}'
set-option -g @_tmux-statusbar-badge-fg '#{?#{E:@_tmux-statusbar-badge-active},#{@tmux-statusbar-fg-prefix},#{@tmux-statusbar-fg-session}}'
set-option -g @_tmux-statusbar-badge-bg '#{?#{E:@_tmux-statusbar-badge-active},#{@tmux-statusbar-bg-prefix},#{@tmux-statusbar-bg-session}}'
# Keep one #() directly in status-left so tmux tracks exactly one format job
# and replaces it when the session name or marquee option changes. The Rust
# renderer emits and exits for short names, and stays resident only to scroll
# long names. It also sanitizes tmux style sequences before rendering.
set-option -g status-left "#[fg=#{E:@_tmux-statusbar-badge-fg},bg=#{E:@_tmux-statusbar-badge-bg}]  #{?#{==:#{@_tmux-statusbar-session-marquee-mode},rust},#(exec #{q:#{@_tmux-statusbar-session-marquee-binary}} #{?#{==:#{@tmux-statusbar-session-marquee},on},--auto,--static} #{q:session_name} 12),#{E:#{=/12/…:#{s/#\\[/# [/:session_name}}}}  #[default]"
set-option -g status-right "#{?#{E:@_tmux-statusbar-prefix-active},#[fg=#{@tmux-statusbar-fg}]#{E:@tmux-statusbar-prefix-content},}#[default]"
set-option -g status-style "fg=#{@tmux-statusbar-fg},bg=#{@tmux-statusbar-bg}"
set-option -g status-left-style "fg=#{@tmux-statusbar-fg-session},bg=#{@tmux-statusbar-bg}"
set-option -g status-right-style "fg=#{@tmux-statusbar-fg},bg=#{@tmux-statusbar-bg}"
set-option -g status-interval 1

# Native messages and prompts use the same muted text and gray fill. Command
# prompt labels get a one-cell inset and the muted status foreground; the
# editable input keeps the message-style foreground.
set-option -g message-style "fg=#{@tmux-statusbar-fg-message},bg=#{@tmux-statusbar-bg-message},fill=#{@tmux-statusbar-bg-message}"
set-option -g message-command-style "fg=#{@tmux-statusbar-fg-message},bg=#{@tmux-statusbar-bg-command},fill=#{@tmux-statusbar-bg-command}"
set-option -g message-format "#{?#{==:#{prompt_type},command},#[fg=#{@tmux-statusbar-fg}] #{message},#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}}"

# Keep the original window-list layout. The centered list uses tmux's natural
# window-name widths; indices replace names only in prefix mode.
set-window-option -g window-status-separator "#[fg=#{@tmux-statusbar-fg}] • #[default]"
set-window-option -g window-status-format "#{?#{==:#{client_key_table},sessions},#[fg=#{@tmux-statusbar-fg}] #{?window_name,#W, }#[nobold],#{?#{E:@_tmux-statusbar-window-index-active},#[fg=#{@tmux-statusbar-fg-accent}]#[bold]#{p-3:#{window_index}}#{p2:#{l:}},#[fg=#{@tmux-statusbar-fg}] #{?window_name,#W,  #{window_index}  }#[nobold]}}#[fg=#{@tmux-statusbar-fg-accent}] "
set-window-option -g window-status-current-format "#{?#{==:#{client_key_table},sessions},#[fg=#{@tmux-statusbar-fg-current}]#[bold] #{?window_name,#W, }#[nobold],#{?#{E:@_tmux-statusbar-window-index-active},#[fg=#{@tmux-statusbar-fg-accent}]#[bold]#{p-3:#{window_index}}#{p2:#{l:}},#[fg=#{@tmux-statusbar-fg-current}]#[bold] #{?window_name,#W,  #{window_index}  }#[nobold]}}#[fg=#{@tmux-statusbar-fg-accent}]#{?#{&&:#{window_zoomed_flag},#{!=:#{E:@_tmux-statusbar-prefix-active},1},#{!=:#{client_key_table},sessions}},#{@tmux-statusbar-maximized-icon}, }"
set-window-option -g window-status-style "fg=#{@tmux-statusbar-fg},bg=#{@tmux-statusbar-bg}"
set-window-option -g window-status-current-style "fg=#{@tmux-statusbar-fg-current},bg=#{@tmux-statusbar-bg},bold"
set-window-option -g window-status-last-style "fg=#{@tmux-statusbar-fg},bg=#{@tmux-statusbar-bg}"
set-window-option -g window-status-activity-style "fg=#{@tmux-statusbar-fg-current},bg=#{@tmux-statusbar-bg}"
set-window-option -g window-status-bell-style "fg=#{@tmux-statusbar-fg-current},bg=#{@tmux-statusbar-bg},bold"
